name: Build FieldBook APK

'on':
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build-apk:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Extract project ZIP
    shell: bash
    run: |
      set -euo pipefail

      ZIP="$GITHUB_WORKSPACE/FieldBook-Complete-GitHub-APK.zip"
      if [ ! -f "$ZIP" ]; then
        echo "ERROR: ZIP not found in repository root."
        ls -la "$GITHUB_WORKSPACE"
        exit 1
      fi

      mkdir -p "$RUNNER_TEMP/fieldbook"
      unzip -q "$ZIP" -d "$RUNNER_TEMP/fieldbook"

      GRADLEW="$(find "$RUNNER_TEMP/fieldbook" -type f -path '*/android/gradlew' -print -quit)"
      if [ -z "$GRADLEW" ]; then
        echo "ERROR: android/gradlew not found inside ZIP."
        find "$RUNNER_TEMP/fieldbook" -maxdepth 5 -type f | head -100
        exit 1
      fi

      ANDROID_DIR="$(dirname "$GRADLEW")"
      PROJECT_DIR="$(dirname "$ANDROID_DIR")"

      if [ ! -f "$PROJECT_DIR/package.json" ]; then
        echo "ERROR: package.json not found beside Android project."
        find "$RUNNER_TEMP/fieldbook" -maxdepth 5 -name package.json
        exit 1
      fi

      if [ ! -f "$PROJECT_DIR/package-lock.json" ]; then
        echo "ERROR: package-lock.json missing."
        exit 1
      fi

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '22'

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install dependencies
    shell: bash
    run: |
      set -euo pipefail
      cd "$PROJECT_DIR"
      npm ci

  - name: Build web application
    shell: bash
    run: |
      set -euo pipefail
      cd "$PROJECT_DIR"
      npm run build

  - name: Sync Capacitor Android
    shell: bash
    run: |
      set -euo pipefail
      cd "$PROJECT_DIR"
      npx cap sync android

  - name: Build debug APK
    shell: bash
    run: |
      set -euo pipefail
      cd "$ANDROID_DIR"
      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon --stacktrace

      APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"
      if [ ! -s "$APK" ]; then
        echo "ERROR: APK was not generated."
        exit 1
      fi

      cp "$APK" "$GITHUB_WORKSPACE/FieldBook-Kisan-App.apk"
      ls -lh "$GITHUB_WORKSPACE/FieldBook-Kisan-App.apk"

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: FieldBook-Kisan-App-APK
      path: FieldBook-Kisan-App.apk
      if-no-files-found: error
      retention-days: 14
