name: Build FieldBook APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk:
    name: Build FieldBook Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate & Extract FieldBook Source ZIP
        shell: bash
        run: |
          set -euo pipefail
          # Prefer FieldBook-Updated-Source.zip if present; otherwise pick the latest uploaded .zip archive
          if [ -f "./FieldBook-Updated-Source.zip" ]; then
            ZIP_FILE="./FieldBook-Updated-Source.zip"
          else
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './.git/*' -not -path './node_modules/*' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2- || true)"
          fi

          if [ -n "${ZIP_FILE:-}" ] && [ -f "$ZIP_FILE" ]; then
            echo "Found uploaded ZIP archive: $ZIP_FILE"
            test -s "$ZIP_FILE" || { echo "ERROR: Uploaded ZIP file '$ZIP_FILE' is empty."; exit 1; }
            echo "Validating ZIP integrity..."
            unzip -t -q "$ZIP_FILE"

            echo "Safely extracting '$ZIP_FILE'..."
            rm -rf _extracted_zip
            mkdir -p _extracted_zip
            unzip -q -o "$ZIP_FILE" -d _extracted_zip

            PKG_JSON="$(find _extracted_zip -type f -name 'package.json' -not -path '*/node_modules/*' | head -n 1 || true)"
            if [ -z "$PKG_JSON" ]; then
              echo "ERROR: Could not locate package.json inside extracted ZIP archive."
              exit 1
            fi

            SRC_ROOT="$(dirname "$PKG_JSON")"
            echo "Detected project root inside archive: $SRC_ROOT"
            rm -rf "$SRC_ROOT/.github"
            cp -af "$SRC_ROOT"/. .
            rm -rf _extracted_zip
            echo "ZIP extraction completed successfully."
          else
            echo "No .zip archive found in repository root; building directly from checked-out source tree."
          fi

          # Verify essential project files exist before continuing
          test -f package.json
          test -f package-lock.json
          test -f android/gradlew
          test -f android/settings.gradle
          test -f public/logo.png
          test -f src/components/CropDetailView.tsx
          test -f src/utils/calculations.ts

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK (API 35 & Build-Tools 35.0.0)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory not found at $SDK_ROOT"
            exit 1
          fi

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          # Locate preinstalled sdkmanager (e.g. cmdline-tools/latest/bin/sdkmanager or cmdline-tools/12.0/bin/sdkmanager)
          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Installing Android SDK Command-line Tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            CMDLINE_ZIP="$RUNNER_TEMP/commandlinetools-linux.zip"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$CMDLINE_ZIP"
            unzip -q -o "$CMDLINE_ZIP" -d "$SDK_ROOT/cmdline-tools"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          CMDLINE_BIN_DIR="$(dirname "$SDKMANAGER")"
          echo "$CMDLINE_BIN_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true

          # Install only valid modern Android SDK packages required by compileSdkVersion=35 / targetSdkVersion=35
          # Note: Never request the obsolete 'tools' package which was removed in modern Android SDK repositories
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          # Write local.properties so Gradle resolves the Android SDK immediately
          printf "sdk.dir=%s\n" "$SDK_ROOT" > android/local.properties
          cat android/local.properties

      - name: Install Dependencies from Lockfile
        shell: bash
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Run TypeScript Type & Lint Check
        run: npm run lint

      - name: Run Automated Verification Tests (17 Suites)
        run: npm run test

      - name: Build Production Web Application
        run: npm run build

      - name: Synchronize Capacitor Android Project
        run: npx cap sync android

      - name: Restore Persistent Fallback Signing Keystore Cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fieldbook-android-signing-keystore-v1
          restore-keys: |
            fieldbook-android-signing-keystore-

      - name: Configure Signing Keystore (GitHub Secrets or Persistent Cached Keystore)
        id: keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.FIELDBOOK_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.FIELDBOOK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FIELDBOOK_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.FIELDBOOK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "Release signing secrets detected in GitHub Secrets. Decoding keystore to temporary runner storage..."
            KS_FILE="$RUNNER_TEMP/fieldbook-release-signing.jks"
            echo "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 --decode > "$KS_FILE"
            chmod 600 "$KS_FILE"
            keytool -list -keystore "$KS_FILE" -storepass "$KEYSTORE_PASS" > /dev/null
            echo "FIELDBOOK_KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "FIELDBOOK_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "FIELDBOOK_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FIELDBOOK_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "signed_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No custom release secrets found in GitHub Settings -> Secrets."
            mkdir -p ~/.android
            if [ ! -f ~/.android/debug.keystore ]; then
              echo "Generating persistent debug.keystore to be cached across future workflow runs..."
              keytool -genkeypair -v \
                -keystore ~/.android/debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            else
              echo "Reusing cached ~/.android/debug.keystore so APK signature remains identical across updates."
            fi
            echo "signed_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-Increment Android Version Code & Build Signed APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

          # Ensure versionCode strictly increases on every GitHub Actions build so Android allows in-place updates
          NEW_VERSION_CODE=$((200 + ${GITHUB_RUN_NUMBER:-1}))
          NEW_VERSION_NAME="2.6.${GITHUB_RUN_NUMBER:-1}"
          export FIELDBOOK_VERSION_CODE="$NEW_VERSION_CODE"
          export FIELDBOOK_VERSION_NAME="$NEW_VERSION_NAME"
          echo "Building com.fieldbook.kisan with versionCode=$NEW_VERSION_CODE, versionName=$NEW_VERSION_NAME"

          if [ "${{ steps.keystore.outputs.signed_release }}" = "true" ]; then
            echo "=== Building Release APK Signed with GitHub Secret Keystore (assembleRelease) ==="
            ./gradlew assembleRelease --no-daemon --stacktrace
            BUILT_APK="app/build/outputs/apk/release/app-release.apk"
          else
            echo "=== Building APK Signed with Persistent Cached Keystore (assembleDebug) ==="
            ./gradlew assembleDebug --no-daemon --stacktrace
            BUILT_APK="app/build/outputs/apk/debug/app-debug.apk"
          fi

          test -s "$BUILT_APK" || { echo "ERROR: Signed APK was not created at $BUILT_APK"; exit 1; }
          cp "$BUILT_APK" "$GITHUB_WORKSPACE/FieldBook-Kisan-App.apk"

          # Verify APK signature schemes (V1/V2/V3) using Android SDK apksigner
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [ -x "$APKSIGNER" ]; then
            echo "Verifying APK signature certificate:"
            "$APKSIGNER" verify --verbose --print-certs "$GITHUB_WORKSPACE/FieldBook-Kisan-App.apk"
          fi

          test -s "$GITHUB_WORKSPACE/FieldBook-Kisan-App.apk"
          ls -lh "$GITHUB_WORKSPACE/FieldBook-Kisan-App.apk"

      - name: Clean Up Temporary Secret Keystore
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/fieldbook-release-signing.jks"

      - name: Upload FieldBook APK Artifact (Single Signed APK)
        uses: actions/upload-artifact@v4
        with:
          name: FieldBook-Updated-APK
          path: FieldBook-Kisan-App.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-apk
          name: "FieldBook Android App (v2.6.${{ github.run_number }})"
          fail_on_unmatched_files: false
          files: |
            FieldBook-Kisan-App.apk
          prerelease: false
