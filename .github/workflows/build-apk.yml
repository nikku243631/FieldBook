name: Build FieldBook Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compile Native Android APK (Capacitor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 21 (Required by Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Production Web Assets (Vite + PWA Offline Cache)
        run: npm run build

      - name: Verify Native Android Project Exists
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Web Bundle into Android Native Container
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Prepare Named FieldBook APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FieldBook-Kisan-v2.4.apk

      - name: Upload FieldBook Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FieldBook-Kisan-Android-APK
          path: FieldBook-Kisan-v2.4.apk
          if-no-files-found: error
