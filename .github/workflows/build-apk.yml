name: Build FieldBook APK

'on':
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build-apk:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Extract uploaded project ZIP
    shell: bash
    run: |
      set -euo pipefail
      test -f FieldBook-Complete-GitHub-APK.zip
      mkdir project
      unzip -q FieldBook-Complete-GitHub-APK.zip -d project

      GRADLEW="$(find "$GITHUB_WORKSPACE/project" -type f -path '*/android/gradlew' -print -quit)"
      if [ -z "$GRADLEW" ]; then
        echo "ERROR: Android Gradle Wrapper not found in uploaded ZIP."
        find project -maxdepth 4 -type f | head -100
        exit 1
      fi

      echo "ANDROID_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Build debug APK
    shell: bash
    run: |
      set -euo pipefail
      cd "$ANDROID_DIR"
      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon
      test -s app/build/outputs/apk/debug/app-debug.apk
      cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/FieldBook-Kisan-App.apk"
      ls -lh "$GITHUB_WORKSPACE/FieldBook-Kisan-App.apk"

  - name: Upload installable APK
    uses: actions/upload-artifact@v4
    with:
      name: FieldBook-Kisan-App-APK
      path: FieldBook-Kisan-App.apk
      if-no-files-found: error
      retention-days: 14
