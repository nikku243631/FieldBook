name: Build FieldBook APK

'on':
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build-apk:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Extract and locate project
    shell: bash
    run: |
      set -euo pipefail

      ZIP_FILE="FieldBook-Complete-GitHub-APK.zip"

      if [ ! -f "$ZIP_FILE" ]; then
        echo "ERROR: Project ZIP is missing from repository root."
        ls -la
        exit 1
      fi

      mkdir -p "$RUNNER_TEMP/fieldbook"
      unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/fieldbook"

      GRADLEW="$(find "$RUNNER_TEMP/fieldbook" -type f -path '*/android/gradlew' -print -quit)"

      if [ -z "$GRADLEW" ]; then
        echo "ERROR: android/gradlew was not found in the ZIP."
        find "$RUNNER_TEMP/fieldbook" -maxdepth 4 -type f | head -100
        exit 1
      fi

      ANDROID_DIR="$(dirname "$GRADLEW")"
      PROJECT_DIR="$(dirname "$ANDROID_DIR")"

      if [ ! -f "$PROJECT_DIR/package.json" ]; then
        echo "ERROR: package.json not found beside the Android project."
        echo "Project directory: $PROJECT_DIR"
        find "$RUNNER_TEMP/fieldbook" -maxdepth 4 -name package.json
        exit 1
      fi

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      echo "Project found: $PROJECT_DIR"
      echo "Android project: $ANDROID_DIR"

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '22'

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Node dependencies
    shell: bash
    run: |
      set -euo pipefail
      cd "$PROJECT_DIR"

      if [ -f package-lock.json ]; then
        npm ci
      else
        echo "ERROR: package-lock.json is missing; reproducible installation cannot proceed."
        exit 1
      fi

  - name: Run available checks
    shell: bash
    run: |
      set -euo pipefail
      cd "$PROJECT_DIR"

      if npm run | grep -qE '^[[:space:]]+lint([[:space:]]|$)'; then
        npm run lint
      else
        echo "No lint script defined; skipping."
      fi

      if npm run | grep -qE '^[[:space:]]+test([[:space:]]|$)'; then
        npm run test --if-present
      else
        echo "No test script defined; skipping."
      fi

  - name: Build web application
    shell: bash
    run: |
      set -euo pipefail
      cd "$PROJECT_DIR"
      npm run build

  - name: Sync Capacitor Android
    shell: bash
    run: |
      set -euo pipefail
      cd "$PROJECT_DIR"

      if [ -d "$PROJECT_DIR/node_modules/@capacitor/cli" ]; then
        npx cap sync android
      else
        echo "ERROR: Capacitor CLI is missing."
        exit 1
      fi

  - name: Build debug APK
    shell: bash
    run: |
      set -euo pipefail
      cd "$ANDROID_DIR"

      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon

      APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

      if [ ! -s "$APK" ]; then
        echo "ERROR: APK was not generated."
        exit 1
      fi

      mkdir -p "$GITHUB_WORKSPACE/output"
      cp "$APK" "$GITHUB_WORKSPACE/output/FieldBook-Kisan-App.apk"
      ls -lh "$GITHUB_WORKSPACE/output/FieldBook-Kisan-App.apk"

  - name: Upload installable APK
    uses: actions/upload-artifact@v4
    with:
      name: FieldBook-Kisan-App-APK
      path: output/FieldBook-Kisan-App.apk
      if-no-files-found: error
      retention-days: 14

    
