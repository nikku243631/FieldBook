name: Build FieldBook APK

'on':
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Extract project ZIP
    run: |
      set -e
      test -f FieldBook-Complete-GitHub-APK.zip
      mkdir -p project
      unzip -q FieldBook-Complete-GitHub-APK.zip -d project
      test -f project/package.json
      test -f project/package-lock.json
      test -f project/android/gradlew
      test -f project/android/settings.gradle

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: '22'
      cache: npm
      cache-dependency-path: project/package-lock.json

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install dependencies
    working-directory: project
    run: npm ci

  - name: TypeScript check
    working-directory: project
    run: npm run lint

  - name: Run tests
    working-directory: project
    run: npm run test

  - name: Build web app
    working-directory: project
    run: npm run build

  - name: Sync Capacitor
    working-directory: project
    run: npx cap sync android

  - name: Build APK
    working-directory: project/android
    run: |
      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon
      test -s app/build/outputs/apk/debug/app-debug.apk
      cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/FieldBook-Kisan-App.apk"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: FieldBook-Kisan-App-APK
      path: FieldBook-Kisan-App.apk
      if-no-files-found: error
      retention-days: 14
