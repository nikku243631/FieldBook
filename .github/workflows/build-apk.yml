name: Build FieldBook APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk:
    name: Build FieldBook Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract FieldBook ZIP (Auto-detects any uploaded .zip file)
        shell: bash
        run: |
          set -euo pipefail
          # Find the latest .zip file uploaded to the repository (handles "FieldBook-Complete-GitHub-APK (1).zip", etc.)
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './.git/*' -not -path './node_modules/*' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2- || true)"

          if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
            echo "Found uploaded ZIP archive: $ZIP_FILE"
            echo "Extracting '$ZIP_FILE' into workspace..."
            rm -rf _extracted_zip
            mkdir -p _extracted_zip
            unzip -q -o "$ZIP_FILE" -d _extracted_zip

            PKG_JSON="$(find _extracted_zip -type f -name 'package.json' -not -path '*/node_modules/*' | head -n 1 || true)"
            if [ -n "$PKG_JSON" ]; then
              SRC_ROOT="$(dirname "$PKG_JSON")"
              echo "Copying extracted project files from $SRC_ROOT to workspace root..."
              rm -rf "$SRC_ROOT/.github"
              cp -af "$SRC_ROOT"/. .
            fi
            rm -rf _extracted_zip
            echo "ZIP extraction completed successfully."
          else
            echo "No .zip archive found; using repository files directly."
          fi

          # Verify essential project files exist before continuing
          test -f package.json
          test -f android/gradlew
          test -f android/settings.gradle
          test -f public/logo.png

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        shell: bash
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: TypeScript Validation
        run: npm run lint

      - name: Run Verification Tests
        run: npm run test

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/FieldBook-Kisan-App.apk"
          ls -lh "$GITHUB_WORKSPACE/FieldBook-Kisan-App.apk"

      - name: Upload FieldBook-Kisan-App-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FieldBook-Kisan-App-APK
          path: FieldBook-Kisan-App.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-apk
          name: "FieldBook Android App (v2.4.0 Debug APK)"
          fail_on_unmatched_files: false
          files: FieldBook-Kisan-App.apk
          prerelease: false
