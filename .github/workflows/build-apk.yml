name: Build FieldBook APK

on:
push:
branches:
- main
- master
workflow_dispatch:

permissions:
contents: read

jobs:
build-apk:
name: Build FieldBook Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Extract FieldBook project ZIP
    run: |
      test -f FieldBook-Complete-GitHub-APK.zip
      mkdir -p fieldbook-project
      unzip -q FieldBook-Complete-GitHub-APK.zip -d fieldbook-project
      test -f fieldbook-project/package.json
      test -f fieldbook-project/package-lock.json
      test -f fieldbook-project/android/gradlew
      test -f fieldbook-project/android/settings.gradle

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '22'
      cache: npm
      cache-dependency-path: fieldbook-project/package-lock.json

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install dependencies
    working-directory: fieldbook-project
    run: npm ci

  - name: TypeScript validation
    working-directory: fieldbook-project
    run: npm run lint

  - name: Run FieldBook tests
    working-directory: fieldbook-project
    run: npm run test

  - name: Build web application
    working-directory: fieldbook-project
    run: npm run build

  - name: Sync Android project
    working-directory: fieldbook-project
    run: npx cap sync android

  - name: Generate Android assets
    working-directory: fieldbook-project
    run: |
      test -f public/pwa-512x512.png
      mkdir -p resources
      cp public/pwa-512x512.png resources/icon.png
      cp public/pwa-512x512.png resources/splash.png
      npx capacitor-assets generate --android --iconBackgroundColor '#065f46' --splashBackgroundColor '#064e3b' --splashBackgroundColorDark '#022c22'
      rm -rf resources

  - name: Build debug APK
    working-directory: fieldbook-project/android
    run: |
      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon
      test -s app/build/outputs/apk/debug/app-debug.apk

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: FieldBook-Kisan-App-APK
      path: fieldbook-project/android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
