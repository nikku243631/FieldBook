name: Build FieldBook APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check ZIP
        run: |
          test -f FieldBook-Complete-GitHub-APK.zip
          unzip -t FieldBook-Complete-GitHub-APK.zip
          
