name: Build FieldBook Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Source ZIP if uploaded directly
        run: |
          if [ ! -f "package.json" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting $ZIP_FILE..."
              unzip -o -q "$ZIP_FILE" -d .
              if [ ! -f "package.json" ]; then
                SUBDIR=$(find . -mindepth 2 -maxdepth 2 -name "package.json" -printf "%h\n" | head -n 1)
                if [ -n "$SUBDIR" ]; then
                  shopt -s dotglob
                  mv "$SUBDIR"/* .
                fi
              fi
            fi
          fi
          test -f package.json

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run TypeScript & Accounting Verification
        run: |
          npm run lint
          npm run test

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Grant execute permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload FieldBook APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FieldBook-By-Mr-Nikhil-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
